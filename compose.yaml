services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: grading
      POSTGRES_USER: grading
      POSTGRES_PASSWORD: grading_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grading -d grading"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
